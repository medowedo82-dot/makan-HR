<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة الإدارة - MAKAN HR</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #eef2f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
    .card { background: #fff; width: 100%; max-width: 460px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); padding: 25px; }
    .logo { font-size: 22px; font-weight: bold; color: #1e293b; text-align: center; margin-bottom: 5px; }
    .subtitle { color: #64748b; font-size: 13px; text-align: center; margin-bottom: 20px; }
    .input-group { margin-bottom: 12px; text-align: right; }
    label { display: block; font-size: 12px; font-weight: 600; color: #334155; margin-bottom: 5px; }
    input, select { width: 100%; padding: 10px 12px; border: 1.5px solid #cbd5e1; border-radius: 8px; font-size: 14px; outline: none; }
    input:focus, select:focus { border-color: #2563eb; }
    button { width: 100%; padding: 12px; background: #2563eb; color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 15px; transition: 0.2s; }
    button:active { transform: scale(0.99); }
    .status-box { margin-top: 15px; padding: 14px; border-radius: 8px; font-size: 13px; display: none; text-align: center; line-height: 1.5; }
    .success { background: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0; }
    .error { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
    .credential-card { background: #ffffff; border: 1.5px dashed #10b981; border-radius: 10px; padding: 12px; margin-top: 10px; text-align: right; color: #1e293b; }
    .cred-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; font-size: 14px; }
    .cred-val { font-family: monospace; font-size: 16px; font-weight: bold; }
    .copy-btn { width: auto; padding: 6px 12px; font-size: 12px; margin-top: 8px; background: #059669; }
  </style>
</head>
<body>

  <!-- شاشة الدخول برمز الأمان للإدارة -->
  <div class="card" id="loginCard">
    <div class="logo">🔐 دخول الإدارة</div>
    <div class="subtitle">نظام مكان للموارد البشرية</div>
    <div class="input-group">
      <label>رمز الأمان (Admin PIN):</label>
      <input type="password" id="adminPin" placeholder="أدخل رمز مرور الإدارة">
    </div>
    <button onclick="checkAdminLogin()">دخول لوحة التحكم</button>
    <div id="loginMsg" class="status-box"></div>
  </div>

  <!-- لوحة تحكم الإدارة (إضافة موظف) -->
  <div class="card" id="adminPanel" style="display: none;">
    <div class="logo">⚙️ لوحة الإدارة</div>
    <div class="subtitle">إضافة موظف جديد وتخصيص البيانات</div>

    <div class="input-group">
      <label>الاسم بالكامل:</label>
      <input type="text" id="fullName" placeholder="مثال: أحمد محمد علي">
    </div>

    <div class="input-group">
      <label>الرقم القومي:</label>
      <input type="text" id="nationalId" placeholder="14 رقم">
    </div>

    <div class="input-group">
      <label>الإدارة:</label>
      <input type="text" id="department" placeholder="مثال: المبيعات / الحسابات">
    </div>

    <div class="input-group">
      <label>نوع الشفت:</label>
      <select id="shiftType">
        <option value="صباحي">صباحي</option>
        <option value="مسائي">مسائي</option>
        <option value="شفت كامل">شفت كامل</option>
      </select>
    </div>

    <button onclick="submitNewEmployee()">➕ إضافة الموظف للنظام</button>
    <div id="adminMsg" class="status-box"></div>
  </div>

  <script>
    const ADMIN_PASSWORD = "123"; 
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyawrgkyHORWdXi9FnUnuKz3aCD4GmRifncv1WsHR7Mwe12s5OU7Cf9Tzr48vvN7aTA/exec";

    function checkAdminLogin() {
      const pin = document.getElementById('adminPin').value.trim();
      if (pin === ADMIN_PASSWORD) {
        document.getElementById('loginCard').style.display = 'none';
        document.getElementById('adminPanel').style.display = 'block';
      } else {
        const msg = document.getElementById('loginMsg');
        msg.textContent = 'رمز المرور غير صحيح!';
        msg.className = 'status-box error';
        msg.style.display = 'block';
      }
    }

    async function submitNewEmployee() {
      const name = document.getElementById('fullName').value.trim();
      const nId = document.getElementById('nationalId').value.trim();
      const dept = document.getElementById('department').value.trim();
      const shift = document.getElementById('shiftType').value;
      const msg = document.getElementById('adminMsg');

      if (!name || !nId || !dept) {
        msg.textContent = 'يرجى ملء جميع الحقول المطلوبة.';
        msg.className = 'status-box error';
        msg.style.display = 'block';
        return;
      }

      msg.textContent = 'جاري تسجيل الموظف وتوليد البيانات...';
      msg.className = 'status-box';
      msg.style.display = 'block';

      try {
        const res = await fetch(SCRIPT_URL, {
          method: 'POST',
          redirect: 'follow',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            action: 'createEmployee',
            fullName: name,
            nationalId: nId,
            department: dept,
            shiftType: shift
          })
        });

        const data = await res.json();

        if (data && data.success && data.result) {
          const emp = data.result;
          msg.className = 'status-box success';
          msg.innerHTML = `
            <div style="font-weight: bold; font-size: 14px;">✅ تم إنشاء الحساب بنجاح!</div>
            <div class="credential-card">
              <div class="cred-row"><span>اسم الموظف:</span><b>${emp.name}</b></div>
              <div class="cred-row"><span>كود الدخول:</span><span class="cred-val" style="color: #2563eb;">${emp.code}</span></div>
              <div class="cred-row"><span>كلمة المرور:</span><span class="cred-val" style="color: #d97706;">${emp.password}</span></div>
              <button type="button" class="copy-btn" onclick="copyCredentials('${emp.name}', '${emp.code}', '${emp.password}')">📋 نسخ بيانات الدخول</button>
            </div>
          `;
          document.getElementById('fullName').value = '';
          document.getElementById('nationalId').value = '';
          document.getElementById('department').value = '';
        } else {
          msg.textContent = (data && data.error) ? data.error : 'تعذر إتمام العملية.';
          msg.className = 'status-box error';
        }
      } catch (e) {
        msg.textContent = 'حدث خطأ في قراءة الرد. يرجى مراجعة شيت Employees للتأكد من تسجيل الحساب.';
        msg.className = 'status-box error';
      }
    }

    function copyCredentials(name, code, pass) {
      const textToCopy = `بيانات دخول نظام الحضور والانصراف (MAKAN HR):\nالموظف: ${name}\nكود الموظف: ${code}\nكلمة المرور: ${pass}`;
      navigator.clipboard.writeText(textToCopy).then(() => {
        alert('تم نسخ بيانات الموظف بنجاح!');
      });
    }
  </script>
</body>
</html>
