<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MAKAN HR - بوابة الموظف</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 15px; }
    .card { background: #fff; width: 100%; max-width: 440px; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.08); padding: 20px; text-align: center; }
    .logo { font-size: 26px; font-weight: bold; color: #1a73e8; margin-bottom: 2px; }
    .subtitle { color: #5f6368; font-size: 13px; margin-bottom: 15px; }
    
    .live-clock { background: #f8f9fa; border: 1px solid #e8eaed; border-radius: 10px; padding: 8px; margin-bottom: 12px; }
    .clock-time { font-size: 22px; font-weight: 700; color: #202124; }
    .clock-date { font-size: 12px; color: #70757a; margin-top: 2px; }

    /* عدادات العمل والبريك التفاعلية */
    .employee-stats-card { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
    .stat-item { background: #f1f5f9; padding: 12px; border-radius: 10px; text-align: center; border-bottom: 3px solid #cbd5e1; }
    .stat-item.work { border-color: #10b981; }
    .stat-item.break { border-color: #f59e0b; }
    .stat-title { font-size: 12px; color: #475569; font-weight: bold; margin-bottom: 4px; }
    .stat-number { font-size: 20px; font-weight: 800; color: #1e293b; direction: ltr; font-variant-numeric: tabular-nums; }

    .pulse { animation: pulseAnim 1.5s infinite; color: #e37400 !important; }
    @keyframes pulseAnim { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

    .emp-badge { background: #e8f0fe; color: #1967d2; padding: 10px; border-radius: 8px; font-size: 14px; font-weight: 600; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
    .top-actions { display: flex; gap: 10px; }
    .link-btn { cursor: pointer; text-decoration: underline; font-size: 12px; border: none; background: none; font-weight: 600; }
    .logout-link { color: #d93025; }
    .pw-link { color: #1a73e8; }

    .input-group { margin-bottom: 12px; text-align: right; }
    label { display: block; font-size: 12px; font-weight: 600; color: #3c4043; margin-bottom: 4px; }
    input, select { width: 100%; padding: 10px; border: 1.5px solid #dadce0; border-radius: 8px; font-size: 14px; outline: none; }
    
    .btn-login { width: 100%; padding: 13px; background-color: #1a73e8; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 10px; }

    .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
    button.action-btn { padding: 12px 8px; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; transition: 0.2s; }
    button.action-btn:active { transform: scale(0.98); }
    
    .btn-checkin { background-color: #0d904f; color: white; }
    .btn-break-start { background-color: #e37400; color: white; }
    .btn-break-end { background-color: #1a73e8; color: white; }
    .btn-checkout { background-color: #d93025; color: white; grid-column: span 2; }
    .btn-request { background-color: #6366f1; color: white; }
    .btn-perm { background-color: #0891b2; color: white; }
    .btn-history { background-color: #475569; color: white; grid-column: span 2; }

    .status-box { margin-top: 15px; padding: 12px; border-radius: 8px; font-size: 13px; display: none; line-height: 1.4; }
    .success { background-color: #e6f4ea; color: #137333; border: 1px solid #ceead6; }
    .error { background-color: #fce8e6; color: #c5221f; border: 1px solid #fad2cf; }
    .loading-info { background-color: #e8f0fe; color: #1967d2; border: 1px solid #d2e3fc; }
    .loading { opacity: 0.6; pointer-events: none; }

    #cameraModal { display: none; margin-top: 15px; background: #000; padding: 10px; border-radius: 12px; }
    #videoPreview { width: 100%; border-radius: 8px; transform: scaleX(-1); }
    #capturedCanvas { display: none; width: 100%; border-radius: 8px; }
    .cam-btn { background: #0d904f; color: #fff; padding: 12px; border: none; border-radius: 8px; font-weight: bold; width: 100%; margin-top: 8px; cursor: pointer; font-size: 14px; }

    .modal-box { display: none; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 15px; margin-top: 15px; text-align: right; }
    .modal-title { font-weight: bold; margin-bottom: 10px; text-align: center; color: #1e293b; }
    .btn-cancel { background: #94a3b8; color: white; margin-top: 8px; }

    .history-table { width: 100%; border-collapse: collapse; font-size: 12px; text-align: right; margin-top: 8px; }
    .history-table th, .history-table td { padding: 8px 6px; border-bottom: 1px solid #e2e8f0; }
    .history-table th { background: #f1f5f9; color: #64748b; }
    .badge-status { padding: 3px 8px; border-radius: 6px; font-weight: bold; font-size: 11px; }
    .badge-approved { background: #dcfce7; color: #166534; }
    .badge-rejected { background: #fee2e2; color: #991b1b; }
    .badge-pending { background: #fef3c7; color: #92400e; }
  </style>
</head>
<body>

  <!-- شاشة الدخول -->
  <div class="card" id="loginCard">
    <div class="logo">MAKAN HR</div>
    <div class="subtitle">تسجيل دخول الموظف</div>
    <div class="input-group">
      <label>كود الموظف:</label>
      <input type="text" id="loginCode" placeholder="مثال: MK2" style="text-align: center; text-transform: uppercase;">
    </div>
    <div class="input-group">
      <label>كلمة المرور:</label>
      <input type="password" id="loginPass" placeholder="••••" style="text-align: center;">
    </div>
    <button class="btn-login" onclick="loginEmployee()">تسجيل الدخول</button>
    <div id="loginStatus" class="status-box"></div>
  </div>

  <!-- لوحة الموظف -->
  <div class="card" id="actionsCard" style="display: none;">
    <div class="logo">MAKAN HR</div>
    <div class="subtitle">بوابة الخدمة الذاتية لتسجيل الحضور والاستراحة</div>

    <div class="live-clock">
      <div class="clock-time" id="currentTime">--:--:--</div>
      <div class="clock-date" id="currentDate">--</div>
    </div>

    <div class="emp-badge">
      <span>مرحباً، <b id="empDisplayName">--</b> (<span id="empDisplayCode">--</span>)</span>
      <div class="top-actions">
        <button class="link-btn pw-link" onclick="toggleModal('pwModal')">🔑 الباسورد</button>
        <button class="link-btn logout-link" onclick="logoutEmployee()">خروج</button>
      </div>
    </div>

    <!-- العدادات الحية التفاعلية -->
    <div class="employee-stats-card">
      <div class="stat-item work">
        <div class="stat-title">⏱️ العمل المنجز اليوم</div>
        <div class="stat-number" id="dispWorkHours">00:00:00</div>
      </div>
      <div class="stat-item break">
        <div class="stat-title" id="breakTitleLabel">☕ إجمالي البريك</div>
        <div class="stat-number" id="dispBreakMinutes">00:00:00</div>
      </div>
    </div>

    <!-- كاميرا السيلفي -->
    <div id="cameraModal">
      <video id="videoPreview" autoplay playsinline></video>
      <canvas id="capturedCanvas"></canvas>
      <button class="cam-btn" id="snapBtn" onclick="processAndConfirmCheckIn()">📸 التقاط وتأكيد الحضور</button>
    </div>

    <!-- أزرار العمليات -->
    <div class="btn-grid" id="actionButtons">
      <button class="action-btn btn-checkin" onclick="startCheckInProcess()">✅ تسجيل حضور</button>
      <button class="action-btn btn-break-start" onclick="sendAction('startBreak')">☕ خروج استراحة</button>
      <button class="action-btn btn-break-end" onclick="sendAction('endBreak')">🔙 رجوع من البريك</button>
      <button class="action-btn btn-request" onclick="toggleModal('leaveModal')">🌴 طلب إجازة</button>
      <button class="action-btn btn-perm" onclick="toggleModal('permModal')">🚪 إذن / انصراف</button>
      <button class="action-btn btn-checkout" onclick="sendAction('checkOut')">🚪 انصراف ونهاية اليوم</button>
      <button class="action-btn btn-history" onclick="openRequestsHistory()">📋 سجل ومتابعة طلباتي</button>
    </div>

    <!-- سجل ومتابعة الطلبات -->
    <div class="modal-box" id="historyModal">
      <div class="modal-title">📋 سجل ومتابعة طلباتي</div>
      <div style="max-height: 220px; overflow-y: auto;">
        <table class="history-table">
          <thead><tr><th>النوع</th><th>التفاصيل</th><th>الحالة</th></tr></thead>
          <tbody id="historyTableBody"><tr><td colspan="3" style="text-align: center;">جاري جلب الطلبات...</td></tr></tbody>
        </table>
      </div>
      <button class="action-btn btn-cancel" style="width: 100%;" onclick="toggleModal('historyModal')">إغلاق</button>
    </div>

    <!-- تغيير الباسورد -->
    <div class="modal-box" id="pwModal">
      <div class="modal-title">🔑 تغيير كلمة المرور</div>
      <div class="input-group"><label>كلمة المرور الحالية:</label><input type="password" id="oldPw"></div>
      <div class="input-group"><label>كلمة المرور الجديدة:</label><input type="password" id="newPw"></div>
      <div class="input-group"><label>تأكيد كلمة المرور الجديدة:</label><input type="password" id="confirmPw"></div>
      <button class="action-btn" style="background:#2563eb; color:white; width:100%;" onclick="submitPasswordChange()">حفظ التغيير</button>
      <button class="action-btn btn-cancel" style="width: 100%;" onclick="toggleModal('pwModal')">إلغاء</button>
    </div>

    <!-- نماذج الإجازات والأذونات -->
    <div class="modal-box" id="leaveModal">
      <div class="modal-title">🌴 نموذج طلب إجازة</div>
      <div class="input-group"><label>نوع الإجازة:</label><select id="leaveType"><option>سنوية</option><option>عارضة</option><option>مرضي</option></select></div>
      <div class="input-group"><label>من تاريخ:</label><input type="date" id="leaveFrom"></div>
      <div class="input-group"><label>إلى تاريخ:</label><input type="date" id="leaveTo"></div>
      <div class="input-group"><label>السبب:</label><input type="text" id="leaveReason"></div>
      <button class="action-btn btn-request" style="width: 100%;" onclick="submitLeave()">إرسال الطلب</button>
      <button class="action-btn btn-cancel" style="width: 100%;" onclick="toggleModal('leaveModal')">إلغاء</button>
    </div>

    <div class="modal-box" id="permModal">
      <div class="modal-title">🚪 طلب إذن / انصراف مبكر</div>
      <div class="input-group"><label>التاريخ:</label><input type="date" id="permDate"></div>
      <div class="input-group"><label>من الساعة:</label><input type="time" id="permFrom"></div>
      <div class="input-group"><label>إلى الساعة:</label><input type="time" id="permTo"></div>
      <div class="input-group"><label>السبب:</label><input type="text" id="permReason"></div>
      <button class="action-btn btn-perm" style="width: 100%;" onclick="submitPerm()">إرسال الطلب</button>
      <button class="action-btn btn-cancel" style="width: 100%;" onclick="toggleModal('permModal')">إلغاء</button>
    </div>

    <div id="actionStatus" class="status-box"></div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyawrgkyHORWdXi9FnUnuKz3aCD4GmRifncv1WsHR7Mwe12s5OU7Cf9Tzr48vvN7aTA/exec";
    let mediaStream = null;
    let userLocation = "";
    let locationPromise = null;
    let liveStatsInterval = null;

    let timerState = {
      checkInTime: null,
      checkOutTime: null,
      onBreak: false,
      breakStartTime: null,
      completedBreakSec: 0
    };

    function updateClock() {
      const now = new Date();
      document.getElementById('currentTime').textContent = now.toLocaleTimeString('ar-EG');
      document.getElementById('currentDate').textContent = now.toLocaleDateString('ar-EG', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
    }
    setInterval(updateClock, 1000);
    updateClock();

    window.onload = function() {
      const savedUser = localStorage.getItem('makan_user');
      if (savedUser) {
        const user = JSON.parse(savedUser);
        showDashboard(user.name, user.code);
      }
    };

    // دالة طلب سحرية تتجاوز حظر CORS و الشبكات تماماً
    async function apiRequest(params) {
      let query = Object.keys(params)
        .map(k => encodeURIComponent(k) + '=' + encodeURIComponent(params[k]))
        .join('&');
      let url = `${SCRIPT_URL}?${query}`;

      try {
        const res = await fetch(url, { method: 'GET', redirect: 'follow' });
        return await res.json();
      } catch (err) {
        // بديل مضمون عبر JSONP عند تعذر fetch
        return new Promise((resolve, reject) => {
          const cbName = 'cb_' + Math.round(100000 * Math.random());
          window[cbName] = function(data) {
            delete window[cbName];
            script.remove();
            resolve(data);
          };
          const script = document.createElement('script');
          script.src = `${url}&callback=${cbName}`;
          script.onerror = () => {
            script.remove();
            reject(new Error('Network Error'));
          };
          document.body.appendChild(script);
        });
      }
    }

    async function loginEmployee() {
      const code = document.getElementById('loginCode').value.trim().toUpperCase();
      const pass = document.getElementById('loginPass').value.trim();
      const statusBox = document.getElementById('loginStatus');

      if (!code || !pass) return showMsg(statusBox, 'يرجى إدخال الكود وكلمة المرور.', 'error');
      showMsg(statusBox, 'جاري التحقق من الحساب...', 'loading-info');

      try {
        const data = await apiRequest({ action: 'login', code: code, password: pass });
        if (data && data.success) {
          localStorage.setItem('makan_user', JSON.stringify({ code: code, name: data.result.name }));
          showDashboard(data.result.name, code);
        } else {
          showMsg(statusBox, (data && data.error) ? data.error : 'بيانات الدخول غير صحيحة.', 'error');
        }
      } catch (err) {
        showMsg(statusBox, 'تعذر الاتصال بالخادم، تأكد من إعداد النشر.', 'error');
      }
    }

    function showDashboard(name, code) {
      document.getElementById('empDisplayName').textContent = name;
      document.getElementById('empDisplayCode').textContent = code;
      document.getElementById('loginCard').style.display = 'none';
      document.getElementById('actionsCard').style.display = 'block';

      const localState = localStorage.getItem('timer_state_' + code);
      if (localState) {
        timerState = JSON.parse(localState);
      }

      fetchEmployeeStats(code);

      if (liveStatsInterval) clearInterval(liveStatsInterval);
      liveStatsInterval = setInterval(runLiveTimers, 1000);
    }

    async function fetchEmployeeStats(code) {
      try {
        const data = await apiRequest({ action: 'getStats', code: code });
        if (data && data.success) {
          const r = data.result;
          timerState.checkInTime = r.checkInTimestamp || timerState.checkInTime;
          timerState.checkOutTime = r.checkOutTimestamp || timerState.checkOutTime;
          timerState.onBreak = r.onBreakNow;
          timerState.breakStartTime = r.currentBreakStartTimestamp || timerState.breakStartTime;
          timerState.completedBreakSec = r.totalBreakSeconds || 0;

          localStorage.setItem('timer_state_' + code, JSON.stringify(timerState));
          runLiveTimers();
        }
      } catch (e) {
        console.warn('تعذر جلب المزامنة، الاعتماد على العداد المحلي.');
      }
    }

    function runLiveTimers() {
      const now = Date.now();
      const breakLabel = document.getElementById('breakTitleLabel');
      const breakDisplay = document.getElementById('dispBreakMinutes');
      const workDisplay = document.getElementById('dispWorkHours');

      let currentOngoingBreakSec = 0;
      if (timerState.onBreak && timerState.breakStartTime) {
        currentOngoingBreakSec = Math.max(0, Math.floor((now - timerState.breakStartTime) / 1000));
        breakLabel.innerHTML = "☕ بريك جاري الآن";
        breakDisplay.classList.add('pulse');
      } else {
        breakLabel.innerHTML = "☕ إجمالي البريك";
        breakDisplay.classList.remove('pulse');
      }
      const totalBreakSec = timerState.completedBreakSec + currentOngoingBreakSec;
      breakDisplay.textContent = formatHMS(totalBreakSec);

      if (timerState.checkInTime) {
        const endWorkTime = timerState.checkOutTime || now;
        const totalElapsedSec = Math.max(0, Math.floor((endWorkTime - timerState.checkInTime) / 1000));
        const netWorkSec = Math.max(0, totalElapsedSec - totalBreakSec);
        workDisplay.textContent = formatHMS(netWorkSec);
      } else {
        workDisplay.textContent = "00:00:00";
      }
    }

    function formatHMS(sec) {
      if (isNaN(sec) || sec < 0) sec = 0;
      const h = String(Math.floor(sec / 3600)).padStart(2, '0');
      const m = String(Math.floor((sec % 3600) / 60)).padStart(2, '0');
      const s = String(sec % 60).padStart(2, '0');
      return `${h}:${m}:${s}`;
    }

    function logoutEmployee() {
      stopCamera();
      if (liveStatsInterval) clearInterval(liveStatsInterval);
      localStorage.removeItem('makan_user');
      location.reload();
    }

    function toggleModal(modalId) {
      const modal = document.getElementById(modalId);
      const isVisible = modal.style.display === 'block';
      document.querySelectorAll('.modal-box').forEach(m => m.style.display = 'none');
      modal.style.display = isVisible ? 'none' : 'block';
    }

    function getPreciseLocation() {
      return new Promise((resolve) => {
        if (!navigator.geolocation) return resolve("");
        navigator.geolocation.getCurrentPosition(
          pos => resolve(`${pos.coords.latitude.toFixed(6)},${pos.coords.longitude.toFixed(6)}`),
          err => { resolve(""); },
          { enableHighAccuracy: true, timeout: 7000, maximumAge: 0 }
        );
      });
    }

    async function startCheckInProcess() {
      const statusBox = document.getElementById('actionStatus');
      showMsg(statusBox, 'جاري تشغيل الكاميرا وتحديد الموقع...', 'loading-info');
      locationPromise = getPreciseLocation();

      try {
        mediaStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } },
          audio: false
        });
        const video = document.getElementById('videoPreview');
        video.srcObject = mediaStream;
        video.style.display = 'block';
        document.getElementById('capturedCanvas').style.display = 'none';
        document.getElementById('cameraModal').style.display = 'block';
        document.getElementById('actionButtons').style.display = 'none';
        showMsg(statusBox, 'اضغط "التقاط وتأكيد الحضور" لتوثيق صورتك.', 'loading-info');
      } catch (e) {
        stopCamera();
        userLocation = await locationPromise;
        sendAction('checkIn', userLocation);
      }
    }

    async function processAndConfirmCheckIn() {
      const video = document.getElementById('videoPreview');
      const canvas = document.getElementById('capturedCanvas');
      const ctx = canvas.getContext('2d');
      const user = JSON.parse(localStorage.getItem('makan_user'));

      canvas.width = video.videoWidth || 640;
      canvas.height = video.videoHeight || 480;

      ctx.save();
      ctx.scale(-1, 1);
      ctx.drawImage(video, -canvas.width, 0, canvas.width, canvas.height);
      ctx.restore();

      userLocation = await locationPromise;

      const now = new Date();
      const timeStr = now.toLocaleTimeString('ar-EG');
      const dateStr = now.toLocaleDateString('ar-EG');
      const locText = userLocation ? `📍 ${userLocation}` : "📍 لم يحدد";

      ctx.fillStyle = "rgba(0, 0, 0, 0.65)";
      ctx.fillRect(0, canvas.height - 75, canvas.width, 75);

      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 15px sans-serif";
      ctx.direction = "rtl";
      ctx.fillText(`👤 ${user.name} (${user.code})`, canvas.width - 20, canvas.height - 48);
      ctx.fillText(`🕒 ${dateStr} - ${timeStr}`, canvas.width - 20, canvas.height - 26);
      ctx.fillText(locText, canvas.width - 20, canvas.height - 8);

      video.style.display = 'none';
      canvas.style.display = 'block';

      stopCamera(false);
      sendAction('checkIn', userLocation);
    }

    function stopCamera(resetUI = true) {
      if (mediaStream) {
        mediaStream.getTracks().forEach(track => track.stop());
        mediaStream = null;
      }
      if (resetUI) {
        document.getElementById('cameraModal').style.display = 'none';
        document.getElementById('actionButtons').style.display = 'grid';
      }
    }

    async function sendAction(actionType, locationCoords = "") {
      const user = JSON.parse(localStorage.getItem('makan_user'));
      if (!user) return logoutEmployee();

      const card = document.getElementById('actionsCard');
      const statusBox = document.getElementById('actionStatus');

      const nowTimestamp = Date.now();
      if (actionType === 'checkIn') {
        timerState.checkInTime = nowTimestamp;
      } else if (actionType === 'startBreak') {
        timerState.onBreak = true;
        timerState.breakStartTime = nowTimestamp;
      } else if (actionType === 'endBreak') {
        if (timerState.onBreak && timerState.breakStartTime) {
          const diffSec = Math.max(0, Math.floor((nowTimestamp - timerState.breakStartTime) / 1000));
          timerState.completedBreakSec += diffSec;
        }
        timerState.onBreak = false;
        timerState.breakStartTime = null;
      } else if (actionType === 'checkOut') {
        timerState.checkOutTime = nowTimestamp;
      }
      localStorage.setItem('timer_state_' + user.code, JSON.stringify(timerState));
      runLiveTimers();

      card.classList.add('loading');
      showMsg(statusBox, 'جاري توثيق الحركة...', 'loading-info');

      try {
        const params = { action: actionType, code: user.code };
        if (locationCoords) params.location = locationCoords;

        const data = await apiRequest(params);

        if (data && data.success) {
          showMsg(statusBox, data.result.message || 'تمت العملية بنجاح!', 'success');
          fetchEmployeeStats(user.code);
        } else {
          showMsg(statusBox, (data && data.error) ? data.error : 'حدث خطأ أثناء التنفيذ.', 'error');
        }
      } catch (err) {
        showMsg(statusBox, 'تم تسجيل الحركة محلياً بنجاح.', 'success');
      } finally {
        card.classList.remove('loading');
        document.getElementById('cameraModal').style.display = 'none';
        document.getElementById('actionButtons').style.display = 'grid';
      }
    }

    async function openRequestsHistory() {
      const user = JSON.parse(localStorage.getItem('makan_user'));
      if (!user) return;

      toggleModal('historyModal');
      const tableBody = document.getElementById('historyTableBody');
      tableBody.innerHTML = '<tr><td colspan="3" style="text-align: center;">جاري جلب سجل طلباتك...</td></tr>';

      try {
        const data = await apiRequest({ action: 'getMyRequests', code: user.code });
        if (data && data.success && data.result.requests.length > 0) {
          tableBody.innerHTML = data.result.requests.map(req => {
            let badgeClass = 'badge-pending', statusText = 'قيد المراجعة';
            if (req.status === 'Approved' || req.status === 'مقبول') {
              badgeClass = 'badge-approved'; statusText = 'مقبول ✅';
            } else if (req.status === 'Rejected' || req.status === 'مرفوض') {
              badgeClass = 'badge-rejected'; statusText = 'مرفوض ❌';
            }
            return `
              <tr>
                <td><b>${req.type}</b></td>
                <td><span style="color:#475569;">${req.details}</span><br><small style="color:#64748b;">${req.reason || ''}</small></td>
                <td><span class="badge-status ${badgeClass}">${statusText}</span></td>
              </tr>
            `;
          }).join('');
        } else {
          tableBody.innerHTML = '<tr><td colspan="3" style="text-align: center;">لا توجد طلبات مسجلة لك حتى الآن.</td></tr>';
        }
      } catch (e) {
        tableBody.innerHTML = '<tr><td colspan="3" style="text-align: center; color: red;">فشل جلب الطلبات.</td></tr>';
      }
    }

    async function submitPasswordChange() {
      const user = JSON.parse(localStorage.getItem('makan_user'));
      const oldPw = document.getElementById('oldPw').value.trim();
      const newPw = document.getElementById('newPw').value.trim();
      const confirmPw = document.getElementById('confirmPw').value.trim();
      const statusBox = document.getElementById('actionStatus');

      if (!oldPw || !newPw || !confirmPw) return alert('يرجى ملء جميع حقول تغيير كلمة المرور.');
      if (newPw !== confirmPw) return alert('كلمة المرور الجديدة وتأكيدها غير متطابقين.');
      if (newPw.length < 4) return alert('يجب ألا تقل كلمة المرور عن 4 خانات.');

      toggleModal('pwModal');
      showMsg(statusBox, 'جاري تحديث كلمة المرور...', 'loading-info');

      try {
        const data = await apiRequest({ action: 'changePassword', code: user.code, oldPassword: oldPw, newPassword: newPw });
        if (data && data.success) {
          showMsg(statusBox, '✅ ' + data.result.message, 'success');
          document.getElementById('oldPw').value = '';
          document.getElementById('newPw').value = '';
          document.getElementById('confirmPw').value = '';
        } else {
          showMsg(statusBox, (data && data.error) ? data.error : 'فشل تغيير كلمة المرور.', 'error');
        }
      } catch (e) {
        showMsg(statusBox, 'حدث خطأ في الاتصال.', 'error');
      }
    }

    async function submitLeave() {
      const user = JSON.parse(localStorage.getItem('makan_user'));
      const type = document.getElementById('leaveType').value;
      const from = document.getElementById('leaveFrom').value;
      const to = document.getElementById('leaveTo').value;
      const reason = document.getElementById('leaveReason').value.trim();
      const statusBox = document.getElementById('actionStatus');

      if (!from || !to || !reason) return alert('يرجى ملء كافة تفاصيل الإجازة.');
      toggleModal('leaveModal');
      showMsg(statusBox, 'جاري إرسال طلب الإجازة...', 'loading-info');

      try {
        const data = await apiRequest({ action: 'submitLeave', code: user.code, type: type, from: from, to: to, reason: reason });
        showMsg(statusBox, data.result.message || 'تم إرسال الطلب بنجاح.', 'success');
      } catch (e) {
        showMsg(statusBox, 'تعذر إرسال الطلب.', 'error');
      }
    }

    async function submitPerm() {
      const user = JSON.parse(localStorage.getItem('makan_user'));
      const date = document.getElementById('permDate').value;
      const from = document.getElementById('permFrom').value;
      const to = document.getElementById('permTo').value;
      const reason = document.getElementById('permReason').value.trim();
      const statusBox = document.getElementById('actionStatus');

      if (!date || !from || !to || !reason) return alert('يرجى ملء كافة تفاصيل الإذن.');
      toggleModal('permModal');
      showMsg(statusBox, 'جاري إرسال طلب الإذن...', 'loading-info');

      try {
        const data = await apiRequest({ action: 'submitPerm', code: user.code, date: date, from: from, to: to, reason: reason });
        showMsg(statusBox, data.result.message || 'تم إرسال الطلب بنجاح.', 'success');
      } catch (e) {
        showMsg(statusBox, 'تعذر إرسال الطلب.', 'error');
      }
    }

    function showMsg(el, text, type) {
      el.textContent = text;
      el.className = 'status-box ' + type;
      el.style.display = 'block';
    }
  </script>
</body>
</html>
